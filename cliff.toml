[changelog]
# Styled header with a visual separator
header = """
# 📖 Changelog\n
All notable changes to this plugin are documented below.\n
---
"""

# Styled body with emojis and clickable commit hashes
body = """
{% if version %}\
    ## 🚀 [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## 🧪 [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

# Styled groups with Emojis for better scannability
commit_parsers = [
    { message = ".*!", group = "⚠️ Breaking Changes" },
    { body = "BREAKING CHANGE", group = "⚠️ Breaking Changes" },
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Fixes" },
    { message = "^chore\\(release\\)", skip = true },
    { message = ".*", group = "🛠️ Other" },
]
filter_commits = false
tag_pattern = "[0-9]*"