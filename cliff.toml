[bump]
features_always_bump_minor = true
breakage_always_bump_major = true
initial_tag = "1.0.0"

[git]
# Matches Conventional Commits: feat, fix, chore, etc.
conventional_commits = true
filter_unconventional = true
# Crucial: Only look at the path provided by the script
limit_commits_to_path = true 
# Matches tags like: base-argo-v1.2.3 or nati-v2.0.1
tag_pattern = "[a-zA-Z0-9-]+-v[0-9]+\\.[0-9]+\\.[0-9]+$"

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        * {{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}\n
"""
