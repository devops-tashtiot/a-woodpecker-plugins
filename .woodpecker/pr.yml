clone:
  git:
    image: harbor.devopstashtiot.page/plugins/plugin-git-cert:prod

when:
  # A PR build no longer pushes anything back to the source branch (no
  # changelog/tag push — that happens only on merge, in publish.yml), so it
  # cannot re-trigger itself. NOTE: do NOT rely on `[skip ci]` to break such a
  # loop — Woodpecker does not honor `[skip ci]` for pull_request events (only
  # push/tag), and an `evaluate` guard on the message was verified not to skip
  # it either. The only robust fix is to not write to the branch from a PR.
  - event: pull_request

steps:
  # - name: Get changed dirs
  #   image: netanelzucaim123/changed-files:latest
  #   environment:
  #     PLUGIN_OUTPUT_FILE: "changed_dirs.txt"
  #     PLUGIN_OUTPUT_TYPE: "dirs"
  #     PLUGIN_FOLDER_DEPTH: "2"
  #     PLUGIN_DEDUP: "true"
  #     PLUGIN_BASE_PATH: plugins

  - name: Run release
    image: harbor.devopstashtiot.page/woodpecker/plugins/master-versions:prod
    settings:
      base_path: "."
      output_tags_file: "new_tags.txt"
      bitbucket_token:
        from_secret: bitbucket_token
      verbose: 2
      changelog_level: "2,3,4"

  # - name: Release diff check
  #   image: netanelzucaim123/master-versions-vs-changed-files:latest
  #   environment:
  #     PLUGIN_MASTER_VERSIONS_LOCATIONS_FILE: "locations.txt"
  #     PLUGIN_CHANGED_DIRS_FILE: "changed_dirs.txt"
  #     PLUGIN_FAIL_ON_MISMATCH: "true"

  - name: Build and push plugin images
    image: harbor.devopstashtiot.page/plugins/buildah-master-versions:latest
    privileged: true
    settings:
      base_path: "."
      registry: "harbor.devopstashtiot.page"
      repo: "woodpecker"
      tags_file: "new_tags.txt"
      aliases: "prod"
      username: "admin"
      password:
        from_secret: harbor_password

  # NOTE: A PR build intentionally does NOT push changelog commits or release
  # tags back to git. It only computes the versions and builds/pushes the
  # candidate images. Persisting the CHANGELOG.md files and creating the git
  # tags happens once, on merge to main, in publish.yml. Pushing from a PR build
  # re-wrote the PR's own source branch on every run — which both re-triggered
  # the pull_request event (Woodpecker ignores [skip ci] for PRs) and, because a
  # brand-new component never exists on the target branch, re-released v1.0.0 and
  # duplicated its changelog on every build.
