clone:
  git:
    image: harbor.devopstashtiot.page/plugins/plugin-git-cert:prod

when:
  - event: manual
  - event: push
    branch: main
    evaluate: 'CI_COMMIT_MESSAGE contains "Merge pull request"'

steps:
  # - name: Get changed dirs
  #   image: netanelzucaim123/changed-files:latest
  #   environment:
  #     PLUGIN_OUTPUT_FILE: "changed_dirs.txt"
  #     PLUGIN_OUTPUT_TYPE: "dirs"
  #     PLUGIN_FOLDER_DEPTH: "2"
  #     PLUGIN_DEDUP: "true"
  #     PLUGIN_BASE_PATH: plugins

  # Split into two steps (rather than one shared step) because the two
  # triggering events read the release message differently: a manual run has
  # no PR to look up, so release.py reads it from PLUGIN_MESSAGE (the
  # ${MESSAGE} value you type into Woodpecker's manual-trigger dialog); a
  # push (merge to main) instead extracts it from the merge commit itself
  # (`git log -1`), so PLUGIN_MESSAGE would just sit there unused and
  # confusing. Only one of the two ever runs, per `when:` below.
  - name: Run release (manual)
    image: netanelzucaim123/master-versions:v1.0.5
    when:
      - event: manual
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_OUTPUT_TAGS_FILE: "new_tags.txt"
      PLUGIN_BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      PLUGIN_MESSAGE: "${MESSAGE}"
      PLUGIN_VERBOSE: 2
      PLUGIN_CHANGELOG_LEVEL: "2,3,4"

  - name: Run release (merge)
    image: netanelzucaim123/master-versions:v1.0.5
    when:
      - event: push
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_OUTPUT_TAGS_FILE: "new_tags.txt"
      PLUGIN_BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      PLUGIN_VERBOSE: 2
      PLUGIN_CHANGELOG_LEVEL: "2,3,4"

  # - name: Release diff check
  #   image: netanelzucaim123/master-versions-vs-changed-files:latest
  #   environment:
  #     PLUGIN_MASTER_VERSIONS_LOCATIONS_FILE: "locations.txt"
  #     PLUGIN_CHANGED_DIRS_FILE: "changed_dirs.txt"
  #     PLUGIN_FAIL_ON_MISMATCH: "true"

  - name: Build and push plugin images
    image: harbor.devopstashtiot.page/plugins/buildah-master-versions:latest
    privileged: true
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_REGISTRY: "harbor.devopstashtiot.page"
      PLUGIN_REPO: "woodpecker"
      PLUGIN_TAGS_FILE: "new_tags.txt"
      PLUGIN_ALIASES: "prod"
      PLUGIN_USERNAME: "admin"
      PLUGIN_PASSWORD:
        from_secret: harbor_password

  - name: Push changelogs to Git
    image: harbor.devopstashtiot.page/base/git-cert:prod
    environment:
      PLUGIN_BASE_PATH: .
      SCOPE_DEPTH: "1"
    commands:
      - git config --global user.email "ci-bot@example.com"
      - git config --global user.name "CI Bot"
      - git config --global safe.directory '*'
      - find . -name "CHANGELOG.md" -not -path "./.git/*" | xargs -r git add
      - |
        # Push the changelog commit + release tags to the branch THIS run is on
        # (CI_COMMIT_BRANCH) — NEVER hardcoded main. So a run on main updates
        # main, a hotfix run persists its own tag on the hotfix branch, and a run
        # on any branch can never force-push onto main. CI_COMMIT_BRANCH is
        # escaped `$${...}` so Woodpecker doesn't substitute it before the shell.
        # --force-with-lease (not plain --force): only overwrites if origin/<branch>
        # still matches what this workspace last saw. If someone else merged to
        # this branch while the (potentially long, 70-image) build was running,
        # the push is rejected instead of silently discarding their commit.
        if [ -n "$${CI_COMMIT_BRANCH}" ]; then
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update CHANGELOG.md files [skip ci]"
            git push --force-with-lease origin "HEAD:$${CI_COMMIT_BRANCH}"
          else
            echo "No changelog changes to commit."
          fi
          for tag in $(cat new_tags.txt); do git tag -f "$tag"; done
          git push --force --tags origin
          echo ">>> Pushed changelog + tags to branch '$${CI_COMMIT_BRANCH}'."
        else
          echo ">>> No CI_COMMIT_BRANCH set — skipping changelog/tag push."
        fi
