  when:
    - event: push
      branch:
        include: [main]
      paths:
        include:
          - plugins/**
    

  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2
    
    - name: Generate Versions and Changelogs
      image: ghcr.io/orhun/git-cliff/git-cliff:latest
#      settings:
#        config: cliff.toml
      commands:
        - |
          sleep 3600
          # Extract unique plugin directories
          grep '^plugins/' changedFiles.txt | cut -d '/' -f 1,2 | sort -u > changed_folders.txt

          while IFS= read -r dir; do
            dir=$(echo "$dir" | tr -d '"\r')
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi
            
            echo "--- Processing: $dir ---"

            # 1. Get CURRENT version
            CURRENT_VERSION=$(cat "$dir/VERSION" 2>/dev/null || echo "1.0.0")

            # 2. Try to get NEXT version from git-cliff (based on HEAD)
            NEXT_VERSION=$(git-cliff HEAD..HEAD \
                          --bumped-version \
                          --provided-tag "$CURRENT_VERSION" \
                          --include-path "$dir/**" || echo "$CURRENT_VERSION")

            # 3. DEFAULT BEHAVIOR: If no bump was detected, force a Patch bump
            if [ "$NEXT_VERSION" = "$CURRENT_VERSION" ]; then
                echo "No conventional commit detected. Forcing patch bump..."
                # Splits version by '.' and increments the last number
                NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{$NF = $NF + 1;} OFS="." {print $0}')
            fi

            echo "New version for $dir: $NEXT_VERSION"
            echo -n "$NEXT_VERSION" > "$dir/VERSION"

            # 4. Generate Changelogק	
            [ ! -f "$dir/CHANGELOG.md" ] && touch "$dir/CHANGELOG.md"
            
            # We use --unpitted to ensure even non-conventional commits appear if they are in the last commit
            git-cliff HEAD..HEAD \
                      --tag "$NEXT_VERSION" \
                      --include-path "$dir/**" \
                      --prepend "$dir/CHANGELOG.md" \
                      --strip all
            
          done < changed_folders.txt
      #when:
      #  branch: main
     #   event: push
