clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

when:
  - event: [pull_request,manual]

steps:
  - name: Fetch PR body
    image: netanelzucaim123/python-git-cliff:latest
    environment:
      GITEA_TOKEN: 48900285bf3075ce084699656ddf5ac7b88685a8
      GITEA_URL: http://gitea-http.gitea.svc.cluster.local:3000
    commands:
      - |
        python3 - <<'EOF'
        import json, os, sys
        from urllib.request import urlopen, Request
        token = os.environ["GITEA_TOKEN"]
        url   = os.environ["GITEA_URL"]
        repo  = os.environ["CI_REPO"]
        req   = Request(f"{url}/api/v1/repos/{repo}/pulls?state=closed&limit=200",
                        headers={"Authorization": f"token {token}"})
        prs   = json.loads(urlopen(req).read())
        if not prs:
            print(">>> No closed PRs found — stopping pipeline")
            sys.exit(1)
        prs.sort(key=lambda p: p.get("merged_at") or p.get("updated_at") or "", reverse=True)
        pr     = prs[0]
        merged = pr.get("merged", False)
        base   = pr.get("base", {}).get("ref", "")
        print(f">>> Latest closed PR #{pr['number']} — merged={merged}, base={base}")
        if not merged or base != "main":
            print(">>> Last PR was not merged into main — stopping pipeline")
            sys.exit(1)
        body = pr.get("body", "")
        open("pr_body.txt", "w").write(body)
        print(">>> PR Body:\n" + body)
        EOF

  - name: Run release
    image: netanelzucaim123/master-versions:latest
    environment:
      PLUGIN_BASE: "."
      PLUGIN_SCOPE_EXCLUDE_REGEX: ""
      PLUGIN_OUTPUT_TAGS_FILE: "new_tags.txt"
      GITEA_TOKEN: 48900285bf3075ce084699656ddf5ac7b88685a8
      GITEA_URL: http://gitea-http.gitea.svc.cluster.local:3000
      PLUGIN_DEBUG: true
    commands:
      - export PLUGIN_MESSAGE="$(cat pr_body.txt)"
      - |
        for var in PLUGIN_BASE PLUGIN_SCOPE_EXCLUDE_REGEX; do
          val=$(grep -m 1 "^$${var}=" pr_body.txt | cut -d= -f2-)
          if [ -n "$val" ]; then
            export "$var=$val"
            echo ">>> Override: $var=$val"
          fi
        done
      - echo ">>> PLUGIN_BASE=$PLUGIN_BASE PLUGIN_SCOPE_EXCLUDE_REGEX=$PLUGIN_SCOPE_EXCLUDE_REGEX"
      - python3 /app/release.py
      - echo ">>> New tags:" && cat new_tags.txt || echo "No tags created"

  - name: Push changelogs to Git
    image: alpine/git
    environment:
      PLUGIN_BASE: "."
      SCOPE_DEPTH: "1"
    commands:
      - '[ -s new_tags.txt ] || { echo "No new tags — skipping"; exit 0; }'
      - |
        for var in SCOPE_DEPTH PLUGIN_BASE; do
          val=$(grep -m 1 "^$${var}=" pr_body.txt | cut -d= -f2-)
          if [ -n "$val" ]; then
            export "$var=$val"
            echo ">>> Override: $var=$val"
          fi
        done
      - echo ">>> SCOPE_DEPTH=$SCOPE_DEPTH PLUGIN_BASE=$PLUGIN_BASE"
      - git config --global user.email "ci-bot@example.com"
      - git config --global user.name "CI Bot"
      - git config --global safe.directory '*'
      - git remote set-url origin "http://ci-bot:48900285bf3075ce084699656ddf5ac7b88685a8@gitea-http.gitea.svc.cluster.local:3000/${CI_REPO}.git"
      - find . -name "CHANGELOG.md" -not -path "./.git/*" | xargs -r git add
      - |
        if ! git diff --cached --quiet; then
          git commit -m "chore(release): update CHANGELOG.md files [skip ci]"
          git push --force origin HEAD:main
        else
          echo "No changelog changes to commit."
        fi
      - |
        # Create each tag pointing to the current HEAD (the changelog commit).
        # This ensures tags reference the commit that includes CHANGELOG.md changes,
        # not the prior HEAD that release.py ran against.
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          git tag -f "$tag"
          echo ">>> Tagged: $tag → $(git rev-parse --short HEAD)"
        done < new_tags.txt
      - git push --force --tags origin

  - name: Build and push plugin images
    image: netanelzucaim123/kaniko-monorepo-cliff:latest
    commands:
      - '[ -s new_tags.txt ] || { echo "No new tags — skipping"; exit 0; }'
      - |
        val=$(grep -m 1 "^PLUGIN_BASE=" pr_body.txt | cut -d= -f2-)
        if [ -n "$val" ]; then
          export PLUGIN_BASE="$val"
          echo ">>> Override: PLUGIN_BASE=$val"
        fi
      - echo ">>> PLUGIN_BASE=$PLUGIN_BASE"
      - /app/plugin.sh
    environment:
      PLUGIN_BASE: "."
      PLUGIN_REGISTRY: "10.89.0.1:5000"
      PLUGIN_REPO: ""
      PLUGIN_TAGS_FILE: "new_tags.txt"
      PLUGIN_INSECURE: "true"
      PLUGIN_REGISTRY_MIRROR: "10.89.0.1:5000"
      PLUGIN_ALIASES: "prod"
      PLUGIN_USERNAME: "local"
      PLUGIN_PASSWORD: "local"




