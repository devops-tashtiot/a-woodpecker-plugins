  when:
    - event: push
      branch:
        include: [main]
    - event: manual
    
  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2
    
    - name: Generate Versions and Changelogs
      image: ghcr.io/orhun/git-cliff/git-cliff:latest
#      settings:
#        config: cliff.toml
      commands:
        - |
          while IFS= read -r dir; do
            # Ensure we are looking at a directory inside 'plugins/' 
            # and it's not the root itself
            if [ -z "$dir" ] || [ "$dir" = "." ]; then continue; fi
            
            echo "Processing: $dir"
            
            # Calculate next version based on folder history
            # If no tags exist, it defaults to 1.0.0 or similar
            NEXT_VERSION=$(git-cliff --bump --include-path "$dir/**" --strip all || echo "1.0.0")
            
            # Save for Kaniko
            echo "$NEXT_VERSION" > "$dir/VERSION"
            
            # Update the local changelog
            git-cliff --tag "$NEXT_VERSION" --include-path "$dir/**" --prepend "$dir/CHANGELOG.md"
            
          done < changedFiles.txt
      when:
        branch: main
        event: push
    #- name: Validate Commit Messages
    #  image: node:lts
    #  commands:
    #    - npm install conventional-commits-parser
    #    - node .github/scripts/validate-commits.js


    - name: Install Dependencies
      image: node:lts
      commands:
        - npm ci

    - name: Login to Docker Hub
      image: docker
      commands:
        - echo $DOCKER_REG_PASSWORD | docker login docker.io -u $DOCKER_REG_USERNAME --password-stdin
      environment:
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD

    - name: Run Manager
      image: node:lts
      commands:
      - echo "machine gitea-http.gitea.svc.cluster.local login $GITEA_TOKEN password x-oauth-basic" > ~/.netrc
      - chmod 600 ~/.netrc
      - node manager.mjs
      environment:
        #GITHUB_TOKEN: ${GITHUB_TOKEN}
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD
        CI_PREV_COMMIT_SHA: ${CI_PREV_COMMIT_SHA}
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        GITEA_TOKEN:
          from_secret: GITEA_TOKEN
        GITEA_USERNAME: netanelzucaim

    - name: Build images
      image: docker.io/netanelzucaim123/kaniko-monorepo:latest
      settings:
        registry: docker.io
        username: 
          from_secret: DOCKER_REG_USERNAME
        password: 
          from_secret: DOCKER_REG_PASSWORD
        repo: netanelzucaim123/woodpecker-dev
        changed_file: changedFiles.txt
        tags:
          - ${CI_COMMIT_SHA:0:11}
      environment:
        GITEA_TOKEN:
          from_secret: GITEA_TOKEN
        GH_TOKEN:
          from_secret: GITEA_TOKEN
        GITEA_USERNAME: netanelzucaim
