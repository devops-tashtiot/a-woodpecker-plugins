  when:
    - event: push
      branch:
        include: [main]
      paths:
        include:
          - plugins/**
    

  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2

    - name: Generate Versions and Changelogs
      image: ghcr.io/orhun/git-cliff/git-cliff:latest
      environment:
        INITIAL_TAG_FALLBACK: 1.0.0
        GIT_CLIFF_CONFIG: cliff.toml
      commands:
        # Fix Git ownership issues in CI
        - git config --global --add safe.directory "$PWD"
        # Make script executable and run it
        - chmod +x git-cliff.sh
        - ./git-cliff.sh


    - name: Generate Versions and Changelogs
      image: ghcr.io/orhun/git-cliff/git-cliff:latest
#      settings:
#        config: cliff.toml
      commands:
        - |
          # Extract unique plugin directories
          grep '^plugins/' changedFiles.txt | cut -d '/' -f 1,2 | sort -u > changed_folders.txt
          while IFS= read -r dir; do
              dir=$(echo "$dir" | tr -d '"\r')
              if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi

              echo ""
              echo "======================================="
              echo "--- Processing: $dir ---"
              echo "======================================="

              CURRENT_VERSION=$(cat "$dir/VERSION" 2>/dev/null || echo "1.0.0")
              echo "Current version: $CURRENT_VERSION"

              # Use a unique mock tag name to avoid conflicts with real release tags
              MOCK_TAG="$CURRENT_VERSION"
              
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                  git tag -f "$MOCK_TAG" HEAD~1 > /dev/null 2>&1
                  RANGE="$MOCK_TAG..HEAD"
              else
                  RANGE="HEAD"
              fi

              echo "Calculating next version..."

              # Fix: Redirect -vv to stderr so it doesn't get captured in the variable
              # Fix: Extract only the final version string from the output
              NEXT_VERSION=$(git-cliff "$RANGE" \
                  --bumped-version \
                  -vv \
                  --include-path "$dir/**" 2> >(tee /dev/stderr) | tail -n 1 || echo "")

              # Cleanup mock tag
              git tag -d "$MOCK_TAG" > /dev/null 2>&1 || true

              # Fallback logic
              if [ -z "$NEXT_VERSION" ] || [ "$NEXT_VERSION" = "$CURRENT_VERSION" ]; then
                  echo "⚠️ Git-cliff did not detect a bump. Forcing manual patch..."
                  NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. 'BEGIN{OFS="."} {$NF=$NF+1; print}')
              else
                  echo "✅ Success! Calculated bump: $NEXT_VERSION"
              fi

              # Update Version file
              echo -n "$NEXT_VERSION" > "$dir/VERSION"

              echo "Updating CHANGELOG.md..."
              # Fix: Use the actual NEXT_VERSION for the tag header in changelog
              # Using HEAD~1..HEAD ensures only the latest commit is added
              git-cliff HEAD~1..HEAD \
                  --tag "$NEXT_VERSION" \
                  --include-path "$dir/**" \
                  --prepend "$dir/CHANGELOG.md" \
                  --strip all || true

          done < changed_folders.txt
      #when:
      #  branch: main
     #   event: push
