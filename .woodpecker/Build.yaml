when:
  - event: push
    path:
      include: ['plugins/**']

steps:
  - name: Get changed files
    image: nanetanelzucaim123/changed-files:latest
    settings:
      output_file: changedFiles.txt
      output_type: dirs
      folder_depth: 2

  - name: Build images and push

  - name: Build images
    image: netanelzucaim123/kaniko-monorepo:lastest
    settings:
      registry: artifactory.company.zucaim
      username: XXXXXXXX
      password:
        from_secret: artifactory_token
      repo: woodpecker-dev
      changed_file: changedFiles.txt
      tags:
        - ${CI_COMMIT_SHA:0:11}
    when:
      - branch:
          exclude: [master]
