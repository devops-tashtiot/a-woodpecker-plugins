  when:
    - event: push
      branch:
        include: [main]
    - event: manual
    
  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2

    #- name: Validate Commit Messages
    #  image: node:lts
    #  commands:
    #    - npm install conventional-commits-parser
    #    - node .github/scripts/validate-commits.js


    - name: Install Dependencies
      image: node:lts
      commands:
        - npm ci

    - name: Login to Docker Hub
      image: docker
      commands:
        - echo $DOCKER_REG_PASSWORD | docker login docker.io -u $DOCKER_REG_USERNAME --password-stdin
      environment:
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD

    - name: Run Manager
      image: node:lts
      commands:
        - node manager.mjs
      environment:
        #GITHUB_TOKEN: ${GITHUB_TOKEN}
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD
        CI_PREV_COMMIT_SHA: ${CI_PREV_COMMIT_SHA}
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}


    - name: Build images
      image: docker.io/netanelzucaim123/kaniko-monorepo:latest
      settings:
        registry: docker.io
        username: 
          from_secret: DOCKER_REG_USERNAME
        password: 
          from_secret: DOCKER_REG_PASSWORD
        repo: ${DOCKER_REG_USERNAME}/woodpecker-dev
        changed_file: changedFiles.txt
        tags:
          - ${CI_COMMIT_SHA:0:11}
      environment:
        GITEA_USERNAME: netanelzucaim
        GITEA_PASSWORD: 617006d5f534d5c589001956680e8805e07132c4

