  when:
    - event: push
      branch:
        include: [main]
      paths:
        include:
          - plugins/**
    

  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2
    
- name: Generate Versions and Changelogs
      image: orhun/git-cliff:latest
      commands:
        - git fetch --tags
        - |
          # Use sed to remove any double quotes or trailing/leading whitespace from the file
          sed -i 's/"//g; s/^[[:space:]]*//; s/[[:space:]]*$//' changedFiles.txt
          
          while IFS= read -r dir || [ -n "$dir" ]; do
            # Skip empty lines
            [ -z "$dir" ] && continue
            
            # Remove any remaining carriage returns (common if coming from different OS)
            dir=$(echo "$dir" | tr -d '\r')
            
            # Check if the directory actually exists before proceeding
            if [ ! -d "$dir" ]; then
              echo "Skipping: $dir (Directory not found)"
              continue
            fi

            echo "Processing: $dir"
            
            # Calculate next version
            NEXT_VERSION=$(git-cliff --bump --include-path "$dir/**" --strip all || echo "0.1.0")
            
            # Create VERSION and CHANGELOG
            echo "$NEXT_VERSION" > "$dir/VERSION"
            git-cliff --config cliff.toml --tag "$NEXT_VERSION" --include-path "$dir/**" --prepend "$dir/CHANGELOG.md"
            
            echo "Successfully updated $dir to $NEXT_VERSION"
          done < changedFiles.txt
      #when:
      #  branch: main
     #   event: push
    #- name: Validate Commit Messages
    #  image: node:lts
    #  commands:
    #    - npm install conventional-commits-parser
    #    - node .github/scripts/validate-commits.js


    - name: Install Dependencies
      image: node:lts
      commands:
        - npm ci

    - name: Login to Docker Hub
      image: docker
      commands:
        - echo $DOCKER_REG_PASSWORD | docker login docker.io -u $DOCKER_REG_USERNAME --password-stdin
      environment:
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD

    - name: Run Manager
      image: node:lts
      commands:
      - echo "machine gitea-http.gitea.svc.cluster.local login $GITEA_TOKEN password x-oauth-basic" > ~/.netrc
      - chmod 600 ~/.netrc
      - node manager.mjs
      environment:
        #GITHUB_TOKEN: ${GITHUB_TOKEN}
        DOCKER_REG_USERNAME:
          from_secret: DOCKER_REG_USERNAME
        DOCKER_REG_PASSWORD:
          from_secret: DOCKER_REG_PASSWORD
        CI_PREV_COMMIT_SHA: ${CI_PREV_COMMIT_SHA}
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        GITEA_TOKEN:
          from_secret: GITEA_TOKEN
        GITEA_USERNAME: netanelzucaim

    - name: Build images
      image: docker.io/netanelzucaim123/kaniko-monorepo:latest
      settings:
        registry: docker.io
        username: 
          from_secret: DOCKER_REG_USERNAME
        password: 
          from_secret: DOCKER_REG_PASSWORD
        repo: netanelzucaim123/woodpecker-dev
        changed_file: changedFiles.txt
        tags:
          - ${CI_COMMIT_SHA:0:11}
      environment:
        GITEA_TOKEN:
          from_secret: GITEA_TOKEN
        GH_TOKEN:
          from_secret: GITEA_TOKEN
