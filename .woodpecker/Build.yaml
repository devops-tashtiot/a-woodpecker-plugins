# 1. FIX: Fetch full history so git-cliff can see previous commits/tags
clone:
  git:
    image: alpine/git
    depth: 0

when:
  - event: push
    branch:
      include: [main]
    paths:
      include:
        - plugins/**

steps:
  - name: Get changed files
    image: docker.io/netanelzucaim123/changed-files:latest
    settings:
      output_file: changedFiles.txt
      output_type: dirs
      folder_depth: 2

  - name: Extract plugin directories
    image: alpine:latest
    commands:
      # This creates the clean list: plugins/harel, plugins/netanel
      - grep '^plugins/' changedFiles.txt | cut -d '/' -f 1,2 | sort -u > changed_folders.txt
      - echo "Directories to process:" && cat changed_folders.txt

  - name: Generate Versions and Changelogs
    image: docker.io/netanelzucaim123/git-cliff:latest
    environment:
      INITIAL_TAG_FALLBACK: 1.0.0
      GIT_CLIFF_CONFIG: cliff.toml
      # 2. FIX: Ensure this matches the filename from the step above
      CHANGED_FOLDERS_FILE: changed_folders.txt
    commands:
      # 3. FIX: Ensure Git recognizes the directory and has all tags
      - sleep 3600
      - chmod +x git-cliff.sh
      - ./git-cliff.sh

  - name: Push changes to Git
    image: alpine/git
    commands:
      - git config --global user.email "ci-bot@example.com"
      - git config --global user.name "CI Bot"
      # Using a more modern push syntax
      - git add -A
      - |
        if ! git diff --cached --quiet; then
          git commit -m "chore(release): update VERSION and CHANGELOG.md [skip ci]"
          git push origin HEAD:main
        else
          echo "No changes to commit."
        fi
    environment:
      # Use a secret for this in production!
      GIT_AUTH_TOKEN: 1f6f2c2197b4690b6dd0039132b9e97c52198aff