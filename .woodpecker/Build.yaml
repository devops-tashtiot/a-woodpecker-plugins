  when:
    - event: push
      branch:
        include: [main]
      paths:
        include:
          - plugins/**
    

  steps:
    - name: Get changed files
      image: docker.io/netanelzucaim123/changed-files:latest
      settings:
        output_file: changedFiles.txt
        output_type: dirs
        folder_depth: 2
    
    - name: Generate Versions and Changelogs
      image: ghcr.io/orhun/git-cliff/git-cliff:latest
#      settings:
#        config: cliff.toml
      commands:
        - |
          cat changedFiles.txt | grep '^plugins/' | cut -d '/' -f 1,2 | sort -u > changed_folders.txt
          while IFS= read -r dir; do
            dir=$(echo "$dir" | tr -d '"' | tr -d '\r')
            
            if [ -z "$dir" ] || [ "$dir" = "." ]; then continue; fi
            
            echo "Processing: $dir"
            mkdir -p "$dir"

            # Calculate version
            NEXT_VERSION=$(GIT_CLIFF__BUMP__INITIAL_TAG="1.0.0" git-cliff --bumped-version --include-path "$dir/**")
            echo "Next version for $dir is $NEXT_VERSION"
            echo "$NEXT_VERSION" > "$dir/VERSION"

            # THE FIX: Create an empty CHANGELOG.md if it doesn't exist yet
            if [ ! -f "$dir/CHANGELOG.md" ]; then
              echo "Creating initial CHANGELOG.md for $dir"
              touch "$dir/CHANGELOG.md"
            fi

            # Prepend new commits to the changelog
            git-cliff --unreleased --tag "$NEXT_VERSION" --include-path "$dir/**" --prepend "$dir/CHANGELOG.md"
            
          done < changed_folders.txt
      #when:
      #  branch: main
     #   event: push
    #- name: Validate Commit Messages
    #  image: node:lts
    #  commands:
    #    - npm install conventional-commits-parser
    #    - node .github/scripts/validate-commits.js


    - name: Build images
      image: docker.io/netanelzucaim123/kaniko-monorepo:latest
      settings:
        registry: docker.io
        username:
          from_secret: DOCKER_REG_USERNAME
        password: 
          from_secret: DOCKER_REG_PASSWORD
        repo: netanelzucaim123
        changed_file: changedFiles.txt