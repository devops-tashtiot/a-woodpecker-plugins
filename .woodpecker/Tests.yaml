when:
  - event: push
    path:
      include:
        - "plugins/**"
        - "base/**"

steps:
  - name: Test changed plugins
    image: netanelzucaim123/python-git-cliff:latest
    privileged: true
    commands:
      - git diff --name-only HEAD~1 HEAD | grep -E '^(plugins|base)/' | cut -d'/' -f1-2 | sort -u > changed_dirs.txt
      - |
        while IFS= read -r dir; do
          [ -d "$dir/tests" ] || continue
          for f in "$dir/tests/"*.py "$dir/tests/"*.sh; do
            [ -f "$f" ] || continue
            echo "\033[1m========================================\033[0m"
            echo "\033[1m>>> RUNNING TEST: $f\033[0m"
            echo "\033[1m========================================\033[0m"
            case "$f" in
              *.py) python3 "$f" || { echo "\033[1;31m>>> FAILED: $f\033[0m"; exit 1; } ;;
              *.sh) sh "$f"      || { echo "\033[1;31m>>> FAILED: $f\033[0m"; exit 1; } ;;
            esac
            echo "\033[1;32m>>> PASSED: $f\033[0m"
          done
        done < changed_dirs.txt
