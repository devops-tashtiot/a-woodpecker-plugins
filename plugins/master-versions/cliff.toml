[bump]
features_always_bump_minor = true
breakage_always_bump_major = true
custom_major_increment_regex = "^breaking"

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "[a-zA-Z0-9-]+-v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
#the order is important - priority by order!
  { message = "^breaking\\((.*?)\\)", group = "Breaking Changes", bump_type = "major" },
  { message = "^breaking",            group = "Breaking Changes", bump_type = "major" },
  { message = "^feat\\((.*?)\\)",     group = "Features" },
  { message = "^feat",                group = "Features" },
  { message = "^fix\\((.*?)\\)",      group = "Bug Fixes" },
  { message = "^fix",                 group = "Bug Fixes" },
  { message = "^other\\((.*?)\\)",    skip = true },
  { message = "^other",               skip = true },
]

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ get_env(name="CI_REPO_LINK", default="") }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d %H:%M") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        * {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}\n
"""
